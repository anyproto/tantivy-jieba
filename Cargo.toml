[package]
name = "tantivy-jieba"
version = "0.11.0"
authors = ["Jiajie Chen <noc@jiegec.ac.cn>"]
edition = "2021"
description = "A library that bridges between tantivy and jieba-rs"
repository = "https://github.com/jiegec/tantivy-jieba"
readme = "README.md"
keywords = ["tantivy", "jieba"]
license = "MIT"

[dependencies]
jieba-rs = "0.7.2"
lazy_static = "1.5.0"
tantivy-tokenizer-api = { git = "https://github.com/anyproto/tantivy.git", rev = "693274a5d4be6da9d069dff4d540162165a99b0e", package = "tantivy-tokenizer-api" }
[dev-dependencies]
tantivy = { git = "https://github.com/anyproto/tantivy.git", rev = "693274a5d4be6da9d069dff4d540162165a99b0e" }
